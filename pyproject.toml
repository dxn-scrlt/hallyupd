[project]
name = "hallyupd"
version = "0.1.0"
description = "K-Pop RPD discovery API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[project.scripts]
hallyupd = "hallyupd:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
